name: Build ConsoleFX

on:
  push:
    branches:
      - main
    paths:
      - 'src/ConsoleFX/**'
      - '*.psd1'
      - '.gitea/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/ConsoleFX/**'
      - '*.psd1'
      - '.gitea/workflows/build.yml'

jobs:
  build:
    name: Build ConsoleFX (net48 + net10.0)
    runs-on: ubuntu-latest
    container:
      image: ${{ secrets.CONTAINER_REGISTRY }}/pwsh:latest
      credentials:
        username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
        password: ${{ secrets.CONTAINER_REGISTRY_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build
        run: dotnet build src/ConsoleFX/ConsoleFX.csproj -c Release

      - name: Upload built module files
        uses: actions/upload-artifact@v3
        with:
          name: consolefx-built-lib
          path: lib/
          if-no-files-found: error

  publish:
    name: Publish ConsoleFX Powershell Module to PSGallery
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ secrets.CONTAINER_REGISTRY }}/pwsh:latest
      credentials:
        username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
        password: ${{ secrets.CONTAINER_REGISTRY_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download built module files
        uses: actions/download-artifact@v3
        with:
          name: consolefx-built-lib
          path: lib/

      - name: Publish PSModuleDocGen Module
        shell: pwsh
        run: |
          $StagingDir = Join-Path ([System.IO.Path]::GetTempPath()) -ChildPath ConsoleFX
          If((Test-Path $StagingDir) -eq $False)
              {
                  New-Item -ItemType Directory -Path $StagingDir | Out-Null
              }

          $PathsToPublish = @(
              '.\ConsoleFX.psd1',
              '.\ConsoleFX.psm1',
              '.\lib',
              '.\Public',
              '.\Private'
          )

          Foreach ($Path in $PathsToPublish)
              {
                  Copy-Item -Path $Path -Destination $StagingDir -Recurse
              }

          $RequiredModules = Import-PowerShellDataFile -Path (Get-ChildItem -Filter *.psd1 | Select-Object -First 1).FullName
          ForEach ($Module in $RequiredModules.RequiredModules)
              {
                  Install-PSResource -Name $Module -TrustRepository
              }

          Set-Location $StagingDir
          Publish-PSResource -Path ./ -Repository 'PSGallery' -ApiKey ${{ secrets.PSGALLERY_API_KEY }}